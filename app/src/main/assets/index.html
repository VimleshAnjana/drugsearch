<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>दवाई सर्च</title>
<style>
:root{--bg:#f6f8f7;--fg:#14211c;--muted:#5b6b64;--card:#ffffff;--line:#dbe3df;--accent:#0f7a5a;--accent-fg:#ffffff;--hl:#fff1a8;--rec:#c62828}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1714;--fg:#e6efeb;--muted:#93a69d;--card:#17221e;--line:#273630;--accent:#3fbf93;--accent-fg:#06231a;--hl:#5a4a00;--rec:#ff6b6b;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:8px;max-width:760px;margin:0 auto}
.field{flex:1;min-width:0;display:flex;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.field:focus-within{border-color:var(--accent)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;padding:12px 4px}
.clear{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 6px}
.mic{flex:none;width:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:grid;place-items:center}
.mic.on{background:var(--rec);color:#fff;animation:pulse 1s infinite}
.lang{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes pulse{50%{opacity:.65}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.meta{max-width:760px;margin:8px auto 0;font-size:13px;color:var(--muted);min-height:1.3em}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
main{padding-right:34px}
#az{position:fixed;right:2px;top:50%;transform:translateY(-50%);height:min(80vh,600px);width:28px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;z-index:6;cursor:pointer}
#az span{font-size:11px;line-height:1;font-weight:600;color:var(--accent);width:100%;text-align:center;flex:1;display:grid;place-items:center}
#az span.off{color:var(--muted);opacity:.4}
#az span.cur{background:var(--accent);color:var(--accent-fg);border-radius:6px;width:22px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="field">
      <input id="q" type="search" placeholder="नाम लिखें (जैसे P, PA…) या बोलें" autocomplete="off" aria-label="दवाई खोजें">
      <button class="clear" id="clr" hidden aria-label="मिटाएँ">×</button>
    </div>
    <button class="lang" id="lang" title="बोलने की भाषा">EN</button>
    <button class="mic" id="mic" aria-label="बोलकर खोजें">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </div>
  <div class="meta" id="meta"></div>
</header>
<div id="az" aria-label="A से Z पर जाएँ"></div>
<main><ul id="list"></ul><div class="empty" id="empty" hidden>कोई दवाई नहीं मिली</div></main>

 Inj IP 10000 IU [176]", "rh-Erythropoetin Inj IP 2000IU [177]"];
const $ = id => document.getElementById(id);
const q=$('q'), list=$('list'), meta=$('meta'), empty=$('empty'), clr=$('clr'), mic=$('mic'), langBtn=$('lang');
const MAX=600;

// Devanagari -> Latin (rough), so Hindi speech can match English names
const V={'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ए':'e','ऐ':'e','ओ':'o','औ':'o','ऑ':'o','ऋ':'ri'};
const M={'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','े':'e','ै':'e','ो':'o','ौ':'o','ॉ':'o','ृ':'ri','ं':'n','ँ':'n','ः':'h','्':''};
const C={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'f','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ळ':'l','क्ष':'ksh','ज्ञ':'gy','ड़':'r','ढ़':'rh','फ़':'f','ज़':'z'};
function translit(s){
  if(!/[ऀ-ॿ]/.test(s)) return s;
  s=s.normalize('NFC').replace(/\u093C/g,'');let o='';
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(V[ch]) o+=V[ch];
    else if(C[ch]!==undefined){
      o+=C[ch];
      const n=s[i+1];
      if(!(n&&(M[n]!==undefined))) o+='a';
    } else if(M[ch]!==undefined) o+=M[ch];
    else o+=ch;
  }
  return o;
}
// loose key: ignore vowels and spelling variants (ph/f, c/k, etc.)
function skel(s){
  return s.toLowerCase().replace(/ph/g,'f').replace(/ck|c(?![eiy])|q/g,'k').replace(/c/g,'s').replace(/x/g,'ks').replace(/z/g,'j')
    .replace(/[^a-z0-9]/g,'').replace(/[aeiouyh]/g,'').replace(/(.)\1+/g,'$1');
}
const DATA = ITEMS.map(t=>{const l=t.toLowerCase();const w=l.split(/[^a-z0-9]+/).filter(Boolean);return {t,l,k:skel(t),w,ws:w.map(skel)}}).sort((a,b)=>a.l.localeCompare(b.l,'en',{numeric:true}));
const firstCh=t=>{const c=t.trim()[0].toUpperCase();return /[A-Z]/.test(c)?c:'#'};

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// ---- fuzzy matching (spelling mistakes / sound-alike) ----
function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=new Array(n+1),cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    const t=prev;prev=cur;cur=t;
  }
  return prev[n];
}
function wordScore(q,qs,w,ws){
  if(w===q) return 100;
  if(q.length>=2 && w.startsWith(q)) return Math.max(70,92-(w.length-q.length)*0.5);
  if(q.length>=3 && w.includes(q)) return 60;
  if(qs.length>=2){ if(ws===qs) return 78; if(ws.startsWith(qs)) return 66; if(qs.length>=3 && ws.includes(qs)) return 58; }
  if(q.length>=3){
    const allow=q.length<=4?1:(q.length<=8?2:3);
    if(q.length>5 || q[0]===w[0]){
      const d=Math.min(lev(q,w),lev(q,w.slice(0,q.length)));
      if(d<=allow) return 80-d*12;
    }
  }
  return 0;
}
function fuzzy(qws){
  const out=[];
  const need=qws.length>=3?qws.length-1:1;
  for(const d of DATA){
    let total=0,m=0;const hl=new Set();
    for(const {q,qs} of qws){
      let best=0,bw=-1;
      for(let i=0;i<d.w.length;i++){
        const s=wordScore(q,qs,d.w[i],d.ws[i]);
        if(s>best){best=s;bw=i}
      }
      if(best>=55){total+=best;m++;hl.add(d.w[bw])}
    }
    if(m>=need) out.push({d,m,total,hl});
  }
  out.sort((a,b)=>b.m-a.m||b.total-a.total||a.d.t.localeCompare(b.d.t));
  return out;
}
function search(term){
  if(!term) return DATA.map(d=>({d}));
  // 1) names that START with what was typed (P -> all P..., PA -> all PA...)
  const rows=DATA.filter(d=>d.l.startsWith(term)).map(d=>({d,pre:true}));
  const letters=term.replace(/[^a-z0-9]/g,'');
  if(letters.length>=3){
    // 2) related names: tolerates wrong / missing letters and sound-alike words
    let words=term.split(/[^a-z0-9]+/).filter(Boolean);
    if(words.length>1) words=words.filter(w=>w.length>=2);
    const qws=words.map(q=>({q,qs:skel(q)}));
    const seen=new Set(rows.map(r=>r.d));
    for(const r of fuzzy(qws)) if(!seen.has(r.d)) rows.push(r);
  } else if(!rows.length){
    for(const d of DATA) if(d.l.includes(term)) rows.push({d});
  }
  return rows;
}
function render(){
  const raw=q.value.trim();
  clr.hidden=!raw;
  const term=translit(raw).toLowerCase().replace(/\s+/g,' ').trim();
  const res=search(term);
  const shown=term?res.slice(0,MAX):res;
  const preRe=term?new RegExp('^('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'):null;
  let prev='';
  list.innerHTML=shown.map(r=>{
    const t=r.d.t;
    const f=firstCh(t);const a=f!==prev?(' data-l="'+f+'"'):'';prev=f;
    let body=esc(t);
    if(r.pre) body=body.replace(preRe,'<mark>$1</mark>');
    else if(r.hl) body=body.replace(/[A-Za-z0-9]+/g,w=>r.hl.has(w.toLowerCase())?'<mark>'+w+'</mark>':w);
    return '<li'+a+'>'+body+'</li>';
  }).join('');
  updateAZ();
  empty.hidden=res.length>0;
  meta.textContent=term?(res.length+' दवाइयाँ'):('कुल '+DATA.length+' दवाइयाँ/सामान');
}
q.addEventListener('input',render);
clr.addEventListener('click',()=>{q.value='';render();q.focus()});

// Voice search
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let lang='en-IN', rec=null;
langBtn.addEventListener('click',()=>{lang=lang==='en-IN'?'hi-IN':'en-IN';langBtn.textContent=lang==='en-IN'?'EN':'हिं'});
// Native (Android app) voice bridge
const NATIVE=!!window.AndroidSpeech; let nativeOn=false;
window.onNativeSpeech=t=>{q.value=(t||'').replace(/[.,।]/g,'').trim();render()};
window.onNativeState=s=>{
  if(s==='start'){nativeOn=true;mic.classList.add('on');meta.textContent='सुन रहा हूँ… दवाई का नाम बोलें';return}
  nativeOn=false;mic.classList.remove('on');
  if(s==='denied') meta.textContent='माइक की अनुमति दें और फिर कोशिश करें';
  else if(s==='unavailable') meta.textContent='इस फ़ोन में Google वॉइस सर्च नहीं मिला';
  else if(s.indexOf('error')===0) meta.textContent='सुनाई नहीं दिया, फिर से बोलें';
  else render();
};
if(!SR&&!NATIVE){mic.disabled=true;mic.style.opacity=.4;meta.textContent='इस ब्राउज़र में बोलकर सर्च नहीं चलता।'}
mic.addEventListener('click',()=>{
  if(NATIVE){ if(nativeOn) window.AndroidSpeech.stop(); else window.AndroidSpeech.start(lang); return }
  if(!SR) return;
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=lang;rec.interimResults=true;rec.maxAlternatives=1;
  rec.onstart=()=>{mic.classList.add('on');meta.textContent='सुन रहा हूँ… दवाई का नाम बोलें'};
  rec.onresult=e=>{
    let t='';for(const r of e.results)t+=r[0].transcript;
    q.value=t.replace(/[.,।]/g,'').trim();render();
  };
  rec.onerror=e=>{
    meta.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'माइक की अनुमति दें और फिर कोशिश करें':'सुनाई नहीं दिया, फिर से बोलें';
  };
  rec.onend=()=>{mic.classList.remove('on');rec=null;if(q.value.trim())render()};
  try{rec.start()}catch(_){rec=null}
});
// A-Z side bar
const az=$('az');
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
az.innerHTML=LETTERS.map(l=>'<span data-k="'+l+'">'+l+'</span>').join('');
let present=new Set();
function updateAZ(){
  present=new Set([...list.querySelectorAll('li[data-l]')].map(li=>li.dataset.l));
  az.querySelectorAll('span').forEach(s=>s.classList.toggle('off',!present.has(s.dataset.k)));
}
function jump(letter){
  // go to this letter, or the next letter that has items
  let i=LETTERS.indexOf(letter);
  let target=null;
  for(let j=i;j<LETTERS.length;j++){const el=list.querySelector('li[data-l="'+LETTERS[j]+'"]');if(el){target=el;break}}
  if(!target) target=[...list.querySelectorAll('li[data-l]')].pop();
  if(target){
    const y=target.getBoundingClientRect().top+window.scrollY-document.querySelector('header').offsetHeight-8;
    window.scrollTo(0,Math.max(0,y));
  }
}
let curL=null;
function pick(e){
  const r=az.getBoundingClientRect();
  const f=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
  const L=LETTERS[Math.min(25,Math.floor(f*26))];
  if(L===curL) return;
  curL=L;
  az.querySelectorAll('span').forEach(s=>s.classList.toggle('cur',s.dataset.k===L));
  jump(L);
}
az.addEventListener('pointerdown',e=>{az.setPointerCapture(e.pointerId);curL=null;pick(e)});
az.addEventListener('pointermove',e=>{if(az.hasPointerCapture(e.pointerId))pick(e)});
const done=()=>{curL=null;az.querySelectorAll('span.cur').forEach(s=>s.classList.remove('cur'))};
az.addEventListener('pointerup',done);az.addEventListener('pointercancel',done);
render();
</script>
